repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: block-env-file
        name: block committing .env files
        entry: .env files must not be committed (use .env.example)
        language: fail
        files: (^|/)\.env(\..*)?$
        exclude: (^|/)\.env\.example$
