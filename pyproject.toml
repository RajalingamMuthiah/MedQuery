[project]
name = "medquery"
version = "0.1.0"
description = "Health-document question answering (RAG) with claim-level hallucination checking."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastembed>=0.9.0",
    "numpy>=2.4.6",
    "openai>=3.35.1",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medquery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
